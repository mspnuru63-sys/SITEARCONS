       <form id="contact-form" action="https://formsubmit.co/ajax/contact@archivescongo.com" method="POST" class="bg-gray-50 p-6 rounded-2xl shadow-md" data-aos="fade-left">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
            <input type="text" name="nom" class="form-input" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email" name="email" class="form-input" required>
        </div>
    </div>
    <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Sujet</label>
        <input type="text" name="_subject" class="form-input">
    </div>
    <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
        <textarea name="message" rows="5" class="form-input" required></textarea>
    </div>
    <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition" style="background: linear-gradient(135deg, #111253, #0a0b41);">Envoyer le message</button>
    
    <!-- Zone d'affichage du statut d'envoi -->
    <p id="form-status" class="mt-4 text-center text-sm font-medium hidden"></p>
</form>
