<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — ARCONS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../logoArcons.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact" data-group="contact" class="bg-gray-50 text-slate-800">
<div id="arcons-header"></div>

<section class="page-hero">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="breadcrumb"><a href="../index.html">Accueil</a><span class="sep">/</span><span>Contact</span></div>
        <h1>Contactez-nous</h1>
        <p>Nous serons ravis de répondre à vos questions et d'étudier vos projets d'archivage.</p>
    </div>
</section>

<section class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-12">
        <div class="space-y-6" data-aos="fade-right">
            <div class="flex items-start gap-4"><div class="bg-emerald-100 p-3 rounded-lg"><svg class="h-6 w-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg></div><div><h4 class="font-semibold">Adresse</h4><p class="text-gray-600">République du Congo — Brazzaville</p></div></div>
            <div class="flex items-start gap-4"><div class="bg-emerald-100 p-3 rounded-lg"><svg class="h-6 w-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg></div><div><h4 class="font-semibold">Téléphone</h4><p class="text-gray-600">+242 06 730 44 41</p></div></div>
            <div class="flex items-start gap-4"><div class="bg-emerald-100 p-3 rounded-lg"><svg class="h-6 w-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div><div><h4 class="font-semibold">Email</h4><p class="text-gray-600">info@arcons.cg</p></div></div>
            <div class="flex items-start gap-4"><div class="bg-emerald-100 p-3 rounded-lg"><svg class="h-6 w-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div><h4 class="font-semibold">Horaires</h4><p class="text-gray-600"> </p></div></div>
        </div>

        <form class="bg-gray-50 p-6 rounded-2xl shadow-md" data-aos="fade-left" onsubmit="event.preventDefault(); alert('Merci, votre message a été envoyé.'); this.reset();">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div><label class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label><input type="text" class="form-input" required></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">Email</label><input type="email" class="form-input" required></div>
            </div>
            <div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Sujet</label><input type="text" class="form-input"></div>
            <div class="mb-6"><label class="block text-sm font-medium text-slate-700 mb-1">Message</label><textarea rows="5" class="form-input" required></textarea></div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition" style="background: linear-gradient(135deg, #111253, #0a0b41);">Envoyer le message</button>
        </form>
    </div>
</section>

<div id="arcons-footer"></div>
<script src="layout.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({duration:800,once:true});</script>
</body>
</html>
